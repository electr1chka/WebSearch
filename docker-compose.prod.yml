services:
  websearch:
    ports: []
    expose:
      - "8787"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - websearch
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
